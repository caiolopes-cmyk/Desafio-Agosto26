<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio Agosto — CML GestãoClick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --gold:#FFC93C;
    --gold-dark:#B8860B;
    --pink:#FF5C8A;
    --pink-dark:#6B2E4A;
    --brick:#E85D3A;
    --brick-dark:#8B2E1F;
    --panel:#14131f;
    --panel2:#1c1a2b;
    --ok:#4ADE80;
    --bg:#0a0912;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,201,60,0.08), transparent 35%),
      radial-gradient(circle at 85% 20%, rgba(255,92,138,0.08), transparent 35%);
    font-family:'VT323', monospace;
    color:#fff;
    padding-bottom:40px;
  }
  h1,h2,.pixel{font-family:'Press Start 2P', cursive;}
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 24px; flex-wrap:wrap; gap:12px;
  }
  .lifebar-wrap{display:flex; align-items:center; gap:10px;}
  .heart{font-size:22px; filter:drop-shadow(0 0 4px var(--pink));}
  .lifebar{
    width:180px; height:18px; background:#2a2438;
    border:3px solid #000; border-radius:2px; position:relative;
    box-shadow: inset 0 0 0 2px #4a3d5c;
  }
  .lifebar-fill{
    height:100%; background:linear-gradient(90deg,var(--pink),#ff8fb3);
    transition:width .4s ease;
  }
  .coins{display:flex; gap:6px; font-size:20px;}
  .title-banner{
    text-align:center; padding:8px 12px 6px;
  }
  .title-banner h1{
    font-size:20px; color:var(--gold); text-shadow:3px 3px 0 #000, -1px -1px 0 var(--brick-dark);
    letter-spacing:1px; margin:0 0 8px;
  }
  .subtitle{font-size:20px; color:#c9c3e0; letter-spacing:1px;}
  .deadline{font-size:16px; color:var(--pink); margin-top:6px;}
  .sync-status{
    text-align:center; font-size:16px; color:#7a7192; margin-top:6px; min-height:20px;
  }
  .sync-status.live{color:var(--ok);}
  .board{
    max-width:1100px; margin:30px auto 0; padding:0 20px;
    display:flex; justify-content:center; align-items:flex-end;
    flex-wrap:wrap; gap:22px;
  }
  .card{
    background:var(--panel);
    border:4px solid #000;
    box-shadow: 0 0 0 3px var(--gold-dark), 6px 6px 0 rgba(0,0,0,.5);
    border-radius:6px;
    padding:16px 16px 20px;
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    width:280px;
    transition:transform .35s ease, order .35s ease, box-shadow .35s ease;
  }
  .card.rank-1{
    order:2;
    transform:translateY(-26px) scale(1.05);
    box-shadow:0 0 0 3px var(--gold), 0 0 30px rgba(255,201,60,.5), 6px 6px 0 rgba(0,0,0,.5);
    z-index:2;
  }
  .card.rank-2{ order:1; }
  .card.rank-3{ order:3; }
  .rank-badge{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#000; font-family:'Press Start 2P';
    font-size:12px; padding:6px 10px; border:3px solid #000; border-radius:4px;
    box-shadow:2px 2px 0 rgba(0,0,0,.6); white-space:nowrap;
  }
  .card.rank-1 .rank-badge{font-size:14px; padding:8px 12px; top:-20px;}
  .card.rank-2 .rank-badge{background:#C9CEDB;}
  .card.rank-3 .rank-badge{background:#D89A63;}
  .avatar-wrap{
    width:100%; display:flex; justify-content:center; margin-top:14px;
    image-rendering:pixelated;
  }
  .avatar-wrap img{width:78%; max-width:220px; image-rendering:pixelated;}
  .team-name{
    width:90%; text-align:center; background:var(--panel2); color:var(--gold);
    border:2px solid var(--gold-dark); border-radius:4px; padding:8px 6px;
    font-family:'Press Start 2P'; font-size:12px; margin-top:10px;
  }
  .team-name:disabled{opacity:.85; -webkit-text-fill-color:var(--gold); cursor:default;}
  .field-label{font-size:19px; color:#a99fc9; margin-top:14px; align-self:flex-start; margin-left:5%;}
  .value-row{width:90%; display:flex; align-items:center; gap:6px; margin-top:4px;}
  .value-prefix{font-family:'Press Start 2P'; font-size:12px; color:var(--ok);}
  .value-input{
    flex:1; background:var(--panel2); color:var(--ok);
    border:2px solid #2d5c3f; border-radius:4px; padding:9px 8px;
    font-family:'VT323'; font-size:22px; text-align:right;
  }
  .value-input:disabled{opacity:.85; -webkit-text-fill-color:var(--ok); cursor:default;}
  .brick-footer{
    height:34px; margin-top:36px;
    background-repeat:repeat-x; background-size:34px 34px;
    background-image:
      linear-gradient(90deg, transparent 32px, #000 32px, #000 34px),
      linear-gradient(180deg, var(--brick) 0 16px, var(--brick-dark) 16px 17px, var(--brick) 17px 33px, #000 33px 34px);
    border-top:3px solid #000; border-bottom:3px solid #000;
  }
  .controls{
    max-width:1100px; margin:30px auto 0; padding:0 20px;
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center;
  }
  button{
    font-family:'Press Start 2P'; font-size:12px; cursor:pointer;
    padding:12px 18px; border:3px solid #000; border-radius:4px;
    box-shadow:3px 3px 0 rgba(0,0,0,.6); transition:transform .1s ease;
  }
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.6);}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none; box-shadow:3px 3px 0 rgba(0,0,0,.6);}
  #saveBtn{background:var(--gold); color:#000;}
  #shareBtn{background:var(--pink); color:#fff;}
  #resetBtn{background:#3a3450; color:#c9c3e0;}
  #adminBtn{background:#2d2848; color:#c9c3e0; font-size:10px; padding:9px 14px;}
  #adminBtn.unlocked{background:var(--ok); color:#000;}
  .saved-msg{
    text-align:center; font-family:'Press Start 2P'; font-size:11px;
    color:var(--ok); height:20px; margin-top:14px; opacity:0; transition:opacity .3s;
  }
  .saved-msg.show{opacity:1;}

  /* CHAT */
  .chat-section{
    max-width:640px; margin:36px auto 0; padding:0 20px;
  }
  .chat-title{
    font-size:13px; color:var(--gold); text-align:center; margin-bottom:10px;
    text-shadow:2px 2px 0 #000;
  }
  .chat-box{
    background:var(--panel); border:4px solid #000; border-radius:6px;
    box-shadow:0 0 0 3px var(--gold-dark), 6px 6px 0 rgba(0,0,0,.5);
    padding:14px;
  }
  .chat-messages{
    height:220px; overflow-y:auto; padding-right:6px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .chat-msg{
    background:var(--panel2); border:2px solid #2d2848; border-radius:6px;
    padding:8px 10px; font-size:19px; line-height:1.25;
  }
  .chat-msg .author{
    color:var(--gold); font-family:'Press Start 2P'; font-size:10px;
    display:block; margin-bottom:3px;
  }
  .chat-empty{color:#7a7192; font-size:18px; text-align:center; padding:20px 0;}
  .chat-input-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chat-name-input{
    width:100%; background:var(--panel2); color:#fff; border:2px solid var(--gold-dark);
    border-radius:4px; padding:8px; font-family:'VT323'; font-size:18px; margin-bottom:8px;
  }
  .chat-msg-input{
    flex:1; min-width:160px; background:var(--panel2); color:#fff; border:2px solid #2d5c3f;
    border-radius:4px; padding:9px 8px; font-family:'VT323'; font-size:19px;
  }
  #chatSendBtn{background:var(--ok); color:#000; padding:10px 16px; font-size:11px;}
  .chat-warning{
    color:#c9c3e0; font-size:17px; text-align:center; padding:16px 6px; line-height:1.4;
  }

  @media (max-width:480px){
    .lifebar{width:120px;}
    .title-banner h1{font-size:15px;}
    .card{width:88vw; max-width:320px;}
    .card.rank-1{transform:translateY(-10px) scale(1.02);}
  }
</style>
</head>

      <input class="team-name" id="name-3" value="Carla &amp; Peu" maxlength="26" disabled>
      <div class="field-label">Valor de vendas</div>
      <div class="value-row">
        <span class="value-prefix">R$</span>
        <input class="value-input" id="value-3" type="number" min="0" step="1" value="34562" disabled>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="saveBtn" disabled>💾 SALVAR</button>
    <button id="shareBtn">📲 COPIAR P/ WHATSAPP</button>
    <button id="resetBtn" disabled>↺ RESETAR</button>
    <button id="adminBtn">🔒 ADMIN</button>
  </div>
  <div class="saved-msg" id="savedMsg">PLACAR ATUALIZADO PARA TODOS!</div>

  <div class="chat-section">
    <div class="chat-title">💬 CHAT DA EQUIPE</div>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty" id="chatEmpty">Nenhuma mensagem ainda. Seja o primeiro!</div>
      </div>
      <input class="chat-name-input" id="chatName" placeholder="Seu nome">
      <div class="chat-input-row">
        <input class="chat-msg-input" id="chatMsg" placeholder="Escreva uma mensagem..." maxlength="240">
        <button id="chatSendBtn">ENVIAR</button>
      </div>
    </div>
  </div>

  <div class="brick-footer"></div>

<script>
const teamIds = [1,2,3];

// ===================== FIREBASE (mesmo projeto do chat e da calculadora) =====================
const firebaseConfig = {
  apiKey: "AIzaSyBaRqy8bNMl7oeIn6zY_0yyJy3ffdpJTz4",
  authDomain: "gestaoclick-cml.firebaseapp.com",
  projectId: "gestaoclick-cml",
  storageBucket: "gestaoclick-cml.firebasestorage.app",
  messagingSenderId: "227093120123",
  appId: "1:227093120123:web:ccbb35b3714cb180fe0ede"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const PLACAR_DOC = db.collection('desafio_agosto_placar').doc('main');
const CHAT_COLLECTION = 'chat_desafio_agosto';

// Troque este PIN por outro se quiser (só você precisa saber).
const ADMIN_PIN = '0831';
let isAdmin = sessionStorage.getItem('desafioAdmin') === '1';

function fmtBRL(n){
  return Number(n||0).toLocaleString('pt-BR');
}

function updateCoins(){
  const row = document.getElementById('coinsRow');
  row.innerHTML = '';
  for(let i=0;i<5;i++){
    const s = document.createElement('span');
    s.textContent = '🪙';
    row.appendChild(s);
  }
}

function updateDeadline(){
  const now = new Date();
  const end = new Date(now.getFullYear(), 7, 31, 23,59,59);
  let diff = Math.ceil((end - now)/(1000*60*60*24));
  if(diff < 0) diff = 0;
  document.getElementById('daysLeft').textContent = diff;
  const dayOfMonth = now.getMonth() === 7 ? now.getDate() : 31;
  const pct = Math.min(100, Math.max(4, (dayOfMonth/31)*100));
  document.getElementById('lifebarFill').style.width = pct + '%';
}

function computeAndApplyRanks(){
  const rows = teamIds.map(id => ({
    id,
    value: Number(document.getElementById('value-'+id).value || 0)
  }));
  rows.sort((a,b) => b.value - a.value);
  const medals = {1:'🥇 1º',2:'🥈 2º',3:'🥉 3º'};
  rows.forEach((row, idx) => {
    const rank = idx + 1;
    const card = document.getElementById('card-'+row.id);
    const badge = document.getElementById('badge-'+row.id);
    card.classList.remove('rank-1','rank-2','rank-3');
    card.classList.add('rank-'+rank);
    badge.textContent = medals[rank];
  });
}

function applyAdminUI(){
  const adminBtn = document.getElementById('adminBtn');
  teamIds.forEach(id=>{
    document.getElementById('name-'+id).disabled = !isAdmin;
    document.getElementById('value-'+id).disabled = !isAdmin;
  });
  document.getElementById('saveBtn').disabled = !isAdmin;
  document.getElementById('resetBtn').disabled = !isAdmin;
  adminBtn.textContent = isAdmin ? '🔓 ADMIN ATIVO' : '🔒 ADMIN';
  adminBtn.classList.toggle('unlocked', isAdmin);
}

document.getElementById('adminBtn').addEventListener('click', ()=>{
  if(isAdmin){
    isAdmin = false;
    sessionStorage.removeItem('desafioAdmin');
    applyAdminUI();
    return;
  }
  const pin = prompt('PIN de administrador:');
  if(pin === ADMIN_PIN){
    isAdmin = true;
    sessionStorage.setItem('desafioAdmin', '1');
    applyAdminUI();
  } else if(pin !== null){
    alert('PIN incorreto.');
  }
});

function setSyncStatus(text, live){
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.classList.toggle('live', !!live);
}

// Escuta o placar em tempo real — todo mundo que abrir o link vê a mesma coisa
PLACAR_DOC.onSnapshot(doc => {
  if(doc.exists){
    const data = doc.data();
    teamIds.forEach(id=>{
      if(data['name-'+id] !== undefined) document.getElementById('name-'+id).value = data['name-'+id];
      if(data['value-'+id] !== undefined) document.getElementById('value-'+id).value = data['value-'+id];
    });
    setSyncStatus('🟢 placar em tempo real, sincronizado para todos', true);
  } else {
    setSyncStatus('placar ainda não iniciado — clique em ADMIN e Salvar', false);
  }
  computeAndApplyRanks();
}, err => {
  console.error('Erro ao ler placar', err);
  setSyncStatus('⚠️ sem conexão com o placar compartilhado', false);
});

function saveState(){
  if(!isAdmin) return;
  const data = {};
  teamIds.forEach(id=>{
    data['name-'+id] = document.getElementById('name-'+id).value;
    data['value-'+id] = document.getElementById('value-'+id).value;
  });
  PLACAR_DOC.set(data).then(()=>{
    const msg = document.getElementById('savedMsg');
    msg.classList.add('show');
    setTimeout(()=>msg.classList.remove('show'), 1800);
  }).catch(e=>{
    alert('Erro ao salvar: ' + e.message);
  });
}

function shareWhatsApp(){
  const rows = teamIds.map(id=>({
    id,
    name: document.getElementById('name-'+id).value,
    value: Number(document.getElementById('value-'+id).value||0)
  })).sort((a,b)=>b.value-a.value);

  const medals = ['🥇','🥈','🥉'];
  let text = '🏆 *DESAFIO AGOSTO — CML GestãoClick*%0A%0A';
  rows.forEach((r,idx)=>{
    text += medals[idx] + ' ' + r.name + ' — R$ ' + fmtBRL(r.value) + '%0A';
  });
  text += '%0AVale até 31/08! Bora fechar mais um! 🚀';
  window.open('https://wa.me/?text=' + text, '_blank');
}

document.querySelectorAll('.team-name, .value-input').forEach(el=>{
  el.addEventListener('input', ()=>{ if(isAdmin) computeAndApplyRanks(); });
});

document.getElementById('saveBtn').addEventListener('click', saveState);
document.getElementById('shareBtn').addEventListener('click', shareWhatsApp);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!isAdmin) return;
  if(confirm('Resetar o placar para todo mundo?')){
    PLACAR_DOC.set({
      'name-1':'Dani & Dener','value-1':'0',
      'name-2':'Átila & Sarah','value-2':'0',
      'name-3':'Carla & Peu','value-3':'0'
    });
  }
});

applyAdminUI();
updateCoins();
updateDeadline();

// ===================== CHAT =====================
function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

const chatMessagesEl = document.getElementById('chatMessages');
const chatEmptyEl = document.getElementById('chatEmpty');
const chatNameInput = document.getElementById('chatName');
const chatMsgInput = document.getElementById('chatMsg');
const chatSendBtn = document.getElementById('chatSendBtn');

chatNameInput.value = localStorage.getItem('chatUserName') || '';
chatNameInput.addEventListener('change', ()=>{
  localStorage.setItem('chatUserName', chatNameInput.value.trim());
});

db.collection(CHAT_COLLECTION)
  .orderBy('createdAt','asc')
  .limitToLast(50)
  .onSnapshot(snapshot => {
    chatMessagesEl.innerHTML = '';
    if(snapshot.empty){
      chatMessagesEl.appendChild(chatEmptyEl);
      return;
    }
    snapshot.forEach(doc => {
      const m = doc.data();
      const item = document.createElement('div');
      item.className = 'chat-msg';
      item.innerHTML = '<span class="author">' + escapeHtml(m.author || 'Anônimo') + '</span>' + escapeHtml(m.text || '');
      chatMessagesEl.appendChild(item);
    });
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }, err => {
    console.error('Erro ao ler chat', err);
    chatMessagesEl.innerHTML = '<div class="chat-warning">⚠️ Erro ao carregar o chat.</div>';
  });

function sendChatMessage(){
  const author = (chatNameInput.value || 'Anônimo').trim().slice(0,30);
  const text = chatMsgInput.value.trim();
  if(!text) return;
  localStorage.setItem('chatUserName', author);
  db.collection(CHAT_COLLECTION).add({
    author, text,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    chatMsgInput.value = '';
  }).catch(e=>console.error('Erro ao enviar', e));
}

chatSendBtn.addEventListener('click', sendChatMessage);
chatMsgInput.addEventListener('keydown', e=>{
  if(e.key === 'Enter') sendChatMessage();
});
</script>
